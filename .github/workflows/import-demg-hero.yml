name: Import approved DEMG illustration
on:
  push:
    paths:
      - .github/workflows/import-demg-hero.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved illustration
        env:
          IMAGE_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2Fa3d59c32-5407-41fa-9cc1-2c9a3d286e2f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANc4GcTMLG-oIfAP9U4yQTRGfUrvzoYrPeorRwgJGFQW&exp=1793278083&osig=AAAAAAAAAAAAAAAAAAAAALbls4LUtJd-hp955dQ_XIU-aIjkiiVIYFmjAaYSUBAn&signer=media-rpc&token=AAIAAU0AJGEzZDU5YzMyLTU0MDctNDFmYS05Y2MxLTJjOWEzZDI4NmUyZgAAAAABoYez_7g7e8LTKowFc_DZUVz0Xz0TL1tRo1d2Lu5N4Hic-_9FkA&x-canva-quality=thumbnail"
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error "$IMAGE_URL" -o assets/demg-hero.png
          file assets/demg-hero.png
          test "$(stat -c%s assets/demg-hero.png)" -gt 1000
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demg-hero.png
          git diff --cached --quiet || (git commit -m "Add DEMG cosmology hero illustration" && git push)
